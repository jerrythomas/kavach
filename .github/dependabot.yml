version: 2

# NOTE ON SCOPE — there is deliberately no `npm` entry here.
#
# This workspace locks with bun.lock, and Dependabot's `npm_and_yarn` ecosystem
# does not read it: a run over this repo mentions bun.lock zero times and its
# PRs edit package.json alone. The lockfile is then stale against the manifest,
# so `bun install --frozen-lockfile` fails and every such PR is red on arrival —
# seven of them were, before this entry was removed.
#
# Auto-syncing the lockfile on Dependabot branches was considered and rejected:
# it needs write access on a PR branch, and the only trigger that grants it
# (`pull_request_target`) would run `bun install` — and therefore the PR's own
# postinstall scripts — with a privileged token.
#
# So npm currency is handled deliberately instead: `bun run upgrade:all`
# (`bun update --latest`), then the full gate. Dependabot alerts and security
# updates stay ENABLED on the repo, so advisories are still reported; they are
# acted on by running that command rather than by merging a broken PR.
updates:
  # github-actions has no lockfile, so Dependabot handles it correctly — PR #33
  # (dependency-review-action v4.9.0 -> v5.0.0) went through green.
  #
  # This entry earns its place: pinning actions by SHA is what makes a workflow
  # tamper-resistant, but it also freezes the action at that commit, so without
  # something moving the pins an action never receives its own security fixes.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: 'chore(actions)'
    # `default-days` does NOT cascade to the per-bump-type fields — they default
    # to 0. Setting only the default left majors with no cooldown at all, which
    # is how five major-bump PRs landed within minutes of this file going live.
    # Each tier is therefore explicit.
    cooldown:
      default-days: 7
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 3
    groups:
      actions:
        patterns: ['*']
