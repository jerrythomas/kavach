name: Publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest
          no-cache: true

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install dependencies
        run: bun install

      - name: Publish packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_NO_WARNINGS: 1
        run: |
          # Publish in dependency order so each package's deps are already on npm
          PACKAGES=(cookie hashing logger query sentry auth ui vite cli)
          VERSION=$(node -p "require('./packages/cookie/package.json').version")
          for name in "${PACKAGES[@]}"; do
            pkg="./packages/${name}/package.json"
            [ -f "$pkg" ] || continue
            grep -q '"private": true' "$pkg" 2>/dev/null && continue
            PKG_NAME=$(node -p "require('$pkg').name")
            # skip if already published (handles partial/retried runs)
            if npm view "${PKG_NAME}@${VERSION}" version 2>/dev/null | grep -qF "${VERSION}"; then
              echo "Skipping ${PKG_NAME}@${VERSION} — already published"
              continue
            fi
            (
              cd "./packages/${name}"
              # Build FIRST. `bun pm pack` does not run prepublishOnly, and
              # `npm publish <tarball>` does not either — lifecycle scripts run
              # only when publishing a directory. Without this, dist/ is never
              # built in CI and the package ships with no type declarations,
              # which is exactly how 1.0.2 went out typeless.
              if node -p "require('./package.json').scripts?.build ? 1 : 0" | grep -q 1; then
                bun run build
              fi
              # bun pm pack rewrites workspace:* deps automatically
              TARBALL=$(bun pm pack | grep '\.tgz$')
              # Refuse to publish a package that promises types it does not ship.
              # A missing declaration is invisible at publish time and only
              # surfaces in a consumer's typecheck, long after the version is
              # immutable on npm.
              TYPES=$(node -p "require('./package.json').types ?? ''")
              if [ -n "$TYPES" ] && ! tar tzf "$TARBALL" | grep -qF "package/${TYPES#./}"; then
                echo "::error::${PKG_NAME}@${VERSION} declares types at ${TYPES} but the tarball has none"
                exit 1
              fi
              # Refuse to publish a tarball whose dependencies a consumer cannot
              # install or which pull stale siblings. `bun pm pack` rewrites
              # `workspace:*` from the version recorded in bun.lock, which does
              # not refresh on a plain `bun install` — that shipped 1.0.1 deps in
              # every release from 1.0.2 to 1.1.2. A git/url dependency is worse
              # still: `npm install kavach` failed outright on `sveltejs/kit`.
              tar xzOf "$TARBALL" package/package.json > /tmp/packed.json
              PKG_JSON=/tmp/packed.json VERSION="$VERSION" node -e '
                const p = require(process.env.PKG_JSON)
                const deps = p.dependencies ?? {}
                const bad = []
                for (const [name, range] of Object.entries(deps)) {
                  const label = name + "@" + range
                  if (/^(git\+|github:|[\w-]+\/[\w-]+$)/.test(range)) bad.push(label + " is a git/url dependency")
                  if (name.startsWith("@kavach/") || name === "kavach") {
                    if (range !== process.env.VERSION) bad.push(label + " should be " + process.env.VERSION)
                  }
                  if (range.startsWith("workspace:")) bad.push(label + " was not rewritten")
                }
                if (bad.length) { console.error(bad.join("\n")); process.exit(1) }
              ' || {
                echo "::error::${PKG_NAME}@${VERSION} has unpublishable dependencies (see above)"
                exit 1
              }
              # Refuse to publish a package Node cannot import. An extensionless
              # relative specifier, or an entry that is still TypeScript, resolves
              # under a bundler and throws under plain Node ESM — invisible at
              # publish time, fatal in a consumer that does not use a bundler.
              #
              # A package blocked solely by a Svelte component is exempt: Node
              # cannot load .svelte at any extension. That is decided from the
              # actual failure, not from the presence of .svelte files — @kavach/vite
              # ships .svelte scaffolding templates it never imports, and a
              # presence check would wrongly skip a Node-loadable plugin.
              ENTRY=$(node -p "require('./package.json').exports?.['.']?.import ?? ''")
              if [ -z "$ENTRY" ]; then
                echo "${PKG_NAME}: no import condition — skipping ESM check"
              else
                ESM_ERR=$(ESM_ENTRY="$PWD/${ENTRY#./}" node --input-type=module \
                  -e 'await import(process.env.ESM_ENTRY)' 2>&1) || {
                  if printf '%s' "$ESM_ERR" | grep -q 'ERR_UNKNOWN_FILE_EXTENSION' &&
                     printf '%s' "$ESM_ERR" | grep -q '\.svelte'; then
                    echo "${PKG_NAME}: bundler-only (imports a Svelte component) — ESM check exempt"
                  else
                    echo "::error::${PKG_NAME}@${VERSION} does not import under plain Node ESM"
                    printf '%s\n' "$ESM_ERR"
                    exit 1
                  fi
                }
              fi
              bunx npm publish "$TARBALL" --provenance --access public --tag latest
              rm -f "$TARBALL"
            )
          done

      - name: Publish adapters
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_NO_WARNINGS: 1
        run: |
          # Publish in dependency order — all adapters depend on kavach (published above)
          ADAPTERS=(amplify auth0 supabase firebase convex)
          VERSION=$(node -p "require('./packages/cookie/package.json').version")
          for name in "${ADAPTERS[@]}"; do
            pkg="./adapters/${name}/package.json"
            [ -f "$pkg" ] || continue
            grep -q '"private": true' "$pkg" 2>/dev/null && continue
            PKG_NAME=$(node -p "require('$pkg').name")
            # skip if already published (handles partial/retried runs)
            if npm view "${PKG_NAME}@${VERSION}" version 2>/dev/null | grep -qF "${VERSION}"; then
              echo "Skipping ${PKG_NAME}@${VERSION} — already published"
              continue
            fi
            (
              cd "./adapters/${name}"
              # Build FIRST. `bun pm pack` does not run prepublishOnly, and
              # `npm publish <tarball>` does not either — lifecycle scripts run
              # only when publishing a directory. Without this, dist/ is never
              # built in CI and the package ships with no type declarations,
              # which is exactly how 1.0.2 went out typeless.
