name: Publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest
          no-cache: true

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install dependencies
        run: bun install

      - name: Publish packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_NO_WARNINGS: 1
        run: |
          # Publish in dependency order so each package's deps are already on npm
          PACKAGES=(cookie hashing logger query sentry auth ui vite cli)
          VERSION=$(node -p "require('./packages/cookie/package.json').version")
          for name in "${PACKAGES[@]}"; do
            pkg="./packages/${name}/package.json"
            [ -f "$pkg" ] || continue
            grep -q '"private": true' "$pkg" 2>/dev/null && continue
            PKG_NAME=$(node -p "require('$pkg').name")
            # skip if already published (handles partial/retried runs)
            if npm view "${PKG_NAME}@${VERSION}" version 2>/dev/null | grep -qF "${VERSION}"; then
              echo "Skipping ${PKG_NAME}@${VERSION} — already published"
              continue
            fi
            (
              cd "./packages/${name}"
              # Build FIRST. `bun pm pack` does not run prepublishOnly, and
              # `npm publish <tarball>` does not either — lifecycle scripts run
              # only when publishing a directory. Without this, dist/ is never
              # built in CI and the package ships with no type declarations,
              # which is exactly how 1.0.2 went out typeless.
              if node -p "require('./package.json').scripts?.build ? 1 : 0" | grep -q 1; then
                bun run build
              fi
              # bun pm pack rewrites workspace:* deps automatically
              TARBALL=$(bun pm pack | grep '\.tgz$')
              # Refuse to publish a package that promises types it does not ship.
              # A missing declaration is invisible at publish time and only
              # surfaces in a consumer's typecheck, long after the version is
              # immutable on npm.
              TYPES=$(node -p "require('./package.json').types ?? ''")
              if [ -n "$TYPES" ] && ! tar tzf "$TARBALL" | grep -qF "package/${TYPES#./}"; then
                echo "::error::${PKG_NAME}@${VERSION} declares types at ${TYPES} but the tarball has none"
                exit 1
              fi
              bunx npm publish "$TARBALL" --provenance --access public --tag latest
              rm -f "$TARBALL"
            )
          done

      - name: Publish adapters
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_NO_WARNINGS: 1
        run: |
          # Publish in dependency order — all adapters depend on kavach (published above)
          ADAPTERS=(amplify auth0 supabase firebase convex)
          VERSION=$(node -p "require('./packages/cookie/package.json').version")
          for name in "${ADAPTERS[@]}"; do
            pkg="./adapters/${name}/package.json"
            [ -f "$pkg" ] || continue
            grep -q '"private": true' "$pkg" 2>/dev/null && continue
            PKG_NAME=$(node -p "require('$pkg').name")
            # skip if already published (handles partial/retried runs)
            if npm view "${PKG_NAME}@${VERSION}" version 2>/dev/null | grep -qF "${VERSION}"; then
              echo "Skipping ${PKG_NAME}@${VERSION} — already published"
              continue
            fi
            (
              cd "./adapters/${name}"
              # Build FIRST. `bun pm pack` does not run prepublishOnly, and
              # `npm publish <tarball>` does not either — lifecycle scripts run
              # only when publishing a directory. Without this, dist/ is never
              # built in CI and the package ships with no type declarations,
              # which is exactly how 1.0.2 went out typeless.
              if node -p "require('./package.json').scripts?.build ? 1 : 0" | grep -q 1; then
                bun run build
              fi
              # bun pm pack rewrites workspace:* deps automatically
              TARBALL=$(bun pm pack | grep '\.tgz$')
              # Refuse to publish a package that promises types it does not ship.
              # A missing declaration is invisible at publish time and only
              # surfaces in a consumer's typecheck, long after the version is
              # immutable on npm.
              TYPES=$(node -p "require('./package.json').types ?? ''")
              if [ -n "$TYPES" ] && ! tar tzf "$TARBALL" | grep -qF "package/${TYPES#./}"; then
                echo "::error::${PKG_NAME}@${VERSION} declares types at ${TYPES} but the tarball has none"
                exit 1
              fi
              bunx npm publish "$TARBALL" --provenance --access public --tag latest
              rm -f "$TARBALL"
            )
          done

      - name: Create GitHub release
        run: npx changelogithub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
