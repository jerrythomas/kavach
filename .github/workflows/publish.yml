                echo "::error::${PKG_NAME}@${VERSION} declares types at ${TYPES} but the tarball has none"
                exit 1
              fi
              # Refuse to publish a tarball whose dependencies a consumer cannot
              # install or which pull stale siblings. `bun pm pack` rewrites
              # `workspace:*` from the version recorded in bun.lock, which does
              # not refresh on a plain `bun install` — that shipped 1.0.1 deps in
              # every release from 1.0.2 to 1.1.2. A git/url dependency is worse
              # still: `npm install kavach` failed outright on `sveltejs/kit`.
              tar xzOf "$TARBALL" package/package.json > /tmp/packed.json
              PKG_JSON=/tmp/packed.json VERSION="$VERSION" node -e '
                const p = require(process.env.PKG_JSON)
                const deps = p.dependencies ?? {}
